name: iOS build check
on:
  push:
  workflow_dispatch:
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode and SDK
        run: xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version
      - name: Typecheck app sources against the iOS SDK
        working-directory: LiveShoot.swiftpm
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun swiftc -typecheck -parse-as-library -swift-version 5 \
            -sdk "$SDK" -target arm64-apple-ios16.0 \
            $(ls *.swift | grep -v '^Package.swift$')
      - name: Build the app package for iOS (no signing)
        working-directory: LiveShoot.swiftpm
        run: |
          set -o pipefail
          xcodebuild -list
          xcodebuild -scheme LiveShoot -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -60
      - name: Show permission strings in the built Info.plist
        run: plutil -p "$RUNNER_TEMP/dd/Build/Products/Debug-iphoneos/LiveShoot.app/Info.plist" | grep -E 'UsageDescription|CFBundleShortVersionString'
